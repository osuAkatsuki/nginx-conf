name: production-deploy
on:
  push:
    branches:
      - public-rev-proxy

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, vpc]
    steps:
      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch
      - name: Run deploy on production
        shell: bash
        env:
          SSH_HOST: ${{ secrets.NEW_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.NEW_SSH_USERNAME }}
          SSH_KEY: ${{ secrets.NEW_SSH_KEY }}
          SSH_PORT: ${{ secrets.NEW_SSH_PORT }}
          BRANCH: ${{ steps.extract_branch.outputs.branch }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" bash -s <<'REMOTE_SCRIPT'
            set -e
            cd /home/programming/nginx-conf
            git fetch origin
            git checkout "origin/$BRANCH"
            git pull origin "$BRANCH"
            rm -rf /etc/nginx/sites-enabled
            if [ -d sites-enabled ]; then
              cp -rT sites-enabled/ /etc/nginx/sites-enabled/
            fi
            rm -rf /etc/nginx/sites-available
            if [ -d sites-available ]; then
              cp -rT sites-available/ /etc/nginx/sites-available/
            fi
            rm /etc/nginx/nginx.conf
            if [ -f nginx.conf ]; then
              cp nginx.conf /etc/nginx/nginx.conf
            fi
            nginx -t
            sudo nginx -s reload
          REMOTE_SCRIPT
          rm -f ~/.ssh/deploy_key
