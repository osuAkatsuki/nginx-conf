# Akatsuki Local Development nginx config
# Copy to /opt/homebrew/etc/nginx/nginx.conf on macOS

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    client_max_body_size 100M;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /opt/homebrew/var/log/nginx/access.log main;
    error_log  /opt/homebrew/var/log/nginx/error.log;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Local service upstreams
    upstream hanayo {
        server 127.0.0.1:46221;
    }

    upstream akatsuki_api {
        server 127.0.0.1:40001;
    }

    upstream profile_history_service {
        server 127.0.0.1:7575;
    }

    upstream bancho_service {
        server 127.0.0.1:5001;
    }

    upstream score_service {
        server 127.0.0.1:7000;
    }

    upstream assets_service {
        server 127.0.0.1:8000;
    }

    upstream beatmaps_service {
        server 127.0.0.1:8080;
    }

    upstream performance_service {
        server 127.0.0.1:8665;
    }

    upstream users_service {
        server 127.0.0.1:8001;
    }

    # Main Akatsuki frontend (akatsuki.gg equivalent)
    server {
        listen 80;
        server_name localhost akatsuki.localhost;

        # Profile history API (must be before /api/)
        location /api/v1/profile-history {
            # CORS for local dev
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Ripple-Token, Authorization' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_pass http://profile_history_service;
        }

        # Main API
        location /api/ {
            # CORS for local dev
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Ripple-Token, Authorization' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_pass http://akatsuki_api;
        }

        # Replay downloads
        location ~ ^/(?:web/replays|d)/\d+$ {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_pass http://score_service;
        }

        # Beatmap downloads
        location /d/ {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_pass http://score_service;
        }

        # Everything else goes to hanayo
        location / {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_pass http://hanayo;
        }
    }

    # osu! web endpoints (osu.akatsuki.gg equivalent)
    server {
        listen 80;
        server_name osu.localhost;

        # Score submission and osu! client web endpoints
        location /web/ {
            client_max_body_size 100M;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_pass http://score_service;
        }

        location /api/v1/pp {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_pass http://score_service;
        }

        location /api/ {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_pass http://akatsuki_api;
        }

        location /d/ {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_pass http://score_service;
        }

        location ~ ^/ss/(.*) {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_pass http://score_service;
        }
    }

    # Bancho server (c.akatsuki.gg equivalent)
    server {
        listen 80;
        server_name c.localhost c4.localhost ce.localhost;

        location / {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_pass http://bancho_service;
        }
    }

    # Avatar service (a.akatsuki.gg equivalent)
    server {
        listen 80;
        server_name a.localhost;

        location / {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            add_header Cache-Control no-cache;
            proxy_pass http://assets_service;
        }
    }

    # Include any additional server configs
    include servers/*;
}
